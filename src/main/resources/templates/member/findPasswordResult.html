<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>::: 비밀번호 찾기 결과 :::</title>
    <style>
        body { background-color: #c0c0c0; font-family: 'Gulim', '굴림', sans-serif; font-size: 9pt; }
        .title-bar { background: linear-gradient(to right, #000080, #1084d0); color: white; font-weight: bold; padding: 2px 5px; }
        .msg-box { background-color: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 15px; margin: 10px 0; text-align: center; }
        a { color: #0000ff; text-decoration: underline; }
    </style>
</head>
<body>
<center>
    <br><br>
    <table border="2" cellspacing="0" cellpadding="0" width="380" style="border-color: #fff #808080 #808080 #fff;">
        <tr>
            <td class="title-bar">📢 안내메시지</td>
        </tr>
        <tr>
            <td style="padding: 20px;" align="center">
                <div th:if="${message != null}" class="msg-box">
                    <font color="#000000" size="2">
                        <b><span th:text="${message}">결과 메시지가 출력됩니다.</span></b>
                    </font>
                </div>

                <br>
                <table border="0" cellspacing="0" cellpadding="2">
                    <tr>
                        <td>👉 <a th:href="@{/member/login}"><b>로그인</b></a></td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</center>
</body>
</html>
