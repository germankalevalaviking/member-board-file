<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>::: 비밀번호 찾기 센터 :::</title>
    <style>
        body { background-color: #c0c0c0; font-family: 'Gulim', '굴림', sans-serif; font-size: 9pt; }
        table { border-collapse: collapse; background-color: #c0c0c0; }
        .title-bar { background: linear-gradient(to right, #000080, #1084d0); color: white; font-weight: bold; padding: 2px 5px; }
        .btn { background-color: #c0c0c0; border: 2px solid; border-color: #fff #808080 #808080 #fff; font-size: 9pt; cursor: pointer; padding: 2px 10px; }
        .btn:active { border-color: #808080 #fff #fff #808080; }
        input { font-size: 9pt; background-color: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 2px; }
    </style>
</head>
<body>
<center>
    <br><br>
    <!-- Windows 98 Window Style Table -->
    <table border="2" cellspacing="0" cellpadding="0" width="350" bgcolor="#c0c0c0" style="border-color: #fff #808080 #808080 #fff;">
        <tr>
            <td class="title-bar">🔑 비밀번호_찾기.exe</td>
        </tr>
        <tr>
            <td style="padding: 15px;">
                <form th:action="@{/member/findPassword}" method="post">
                    <table border="0" width="100%">
                        <tr>
                            <td align="center">
                                <b>가입하신 이메일을 입력하세요.</b><br><br>
                                <input type="email" name="email" th:value="${email}" size="30" required>
                                <br><br>
                                <input type="submit" class="btn" value=" 찾 기 ">
                            </td>
                        </tr>
                    </table>
                </form>
            </td>
        </tr>
    </table>
</center>
</body>
</html>
