<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>

        body{
            background-color:#C0C0C0;
            font-family: gulim, 돋움, sans-serif;
            font-size:14px;
        }

        .box{
            width:400px;
            margin:100px auto;
            border:2px solid black;
            background:white;
        }

        .title{
            background:navy;
            color:white;
            padding:8px;
            font-weight:bold;
        }

        table{
            width:100%;
            padding:15px;
        }

        td{
            padding:5px;
        }

        input{
            width:95%;
            border:2px inset #999;
            padding:4px;
            font-size:14px;
        }

        .error{
            color:red;
            font-size:12px;
        }

        .btn{
            background:#E0E0E0;
            border:2px outset white;
            padding:5px 15px;
            cursor:pointer;
            font-weight:bold;
        }

        .btn:active{
            border:2px inset gray;
        }

        .bottom{
            text-align:center;
            padding-bottom:15px;
        }

    </style>

</head>
<body>

<div class="box">

    <div class="title">
        회원가입
    </div>

    <script th:if="${errorMessage}">
        alert('[[${errorMessage}]]');
    </script>

    <form th:action="@{/member/new}" th:object="${memberFormDto}" method="post">

        <table>
            <tr>
                <td>이메일</td>
                <td>
                    <input type="text" th:field="*{email}">
                    <p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </td>
            </tr>

            <tr>
                <td>이름</td>
                <td>
                    <input type="text" th:field="*{name}">
                    <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </td>
            </tr>

            <tr>
                <td>전화번호</td>
                <td>
                    <input type="text" th:field="*{phone}">
                    <p class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </td>
            </tr>

            <tr>
                <td>비밀번호</td>
                <td>
                    <input type="password" th:field="*{password}">
                    <p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </td>
            </tr>
        </table>

        <div class="bottom">
            <button type="submit" class="btn">회원가입</button>
        </div>

    </form>

</div>

</body>
</html>
