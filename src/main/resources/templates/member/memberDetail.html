<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 상세 정보</title>
</head>

<body bgcolor="#C0C0C0">

<center>

    <!-- 제목 -->
    <span style="font-size:x-large; color:blue;">
        <b>[ 회원 상세 정보 ]</b>
    </span>

    <br><br>

    <!-- 90년대 감성 -->
    <marquee width="450" behavior="alternate" scrollamount="4">
        ★ 회원님의 상세 정보를 확인할 수 있습니다 ★
    </marquee>

    <br><br>

    <!-- 회원 정보 테이블 -->
    <table border="2"
           cellpadding="8"
           cellspacing="2"
           bgcolor="#E0E0E0"
           width="500">

        <tr>
            <td bgcolor="#B0C4DE" width="150">
                <b>회원번호</b>
            </td>
            <td>
                <span th:text="${member.id}"></span>
            </td>
        </tr>

        <tr>
            <td bgcolor="#B0C4DE">
                <b>이메일</b>
            </td>
            <td>
                <span th:text="${member.email}"></span>
            </td>
        </tr>

        <tr>
            <td bgcolor="#B0C4DE">
                <b>이름</b>
            </td>
            <td>
                <span th:text="${member.name}"></span>
            </td>
        </tr>

        <tr>
            <td bgcolor="#B0C4DE">
                <b>전화번호</b>
            </td>
            <td>
                <span th:text="${member.phone}"></span>
            </td>
        </tr>

        <tr>
            <td bgcolor="#B0C4DE">
                <b>권한</b>
            </td>
            <td>
                <span th:text="${member.role}"></span>
            </td>
        </tr>

        <tr>
            <td bgcolor="#B0C4DE">
                <b>가입일</b>
            </td>
            <td>
                <span th:text="${member.regTime}"></span>
            </td>
        </tr>

    </table>

    <br>

    <hr width="500">

    <!-- 메뉴 -->
    <table border="1"
           cellpadding="5"
           bgcolor="#FFFFCC">

        <tr>
            <td>
                <a th:href="@{/member/memberUpdateForm}">
                    ▶ 회원정보 수정
                </a>
            </td>
        </tr>

        <tr>
            <td>
            <form th:action="@{/member/delete}" method="post" onsubmit="return confirm('정말로 탈퇴하시겠습니까?');">
                <button type="submit" style="background:none; border:none; color:blue;
                                 cursor:pointer; font-size:16px; padding:0; font-family:inherit;">
                    ▶ 회원 탈퇴
                </button>
            </form>
            </td>
        </tr>

        <tr>
            <td>
                <a th:href="@{/}">
                    ▶ 메인으로
                </a>
            </td>
        </tr>

    </table>

    <br>

    <font color="navy">
        현재 접속 중인 회원 정보입니다.
    </font>

</center>

</body>
</html>
