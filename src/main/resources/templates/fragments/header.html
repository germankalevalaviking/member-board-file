<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="header"
     style="background-color:#f8f9fa; border-bottom:1px solid #dee2e6; padding:15px 20px; margin-bottom:20px;">

    <div style="max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; font-family:sans-serif;">

        <div>
            <a th:href="@{/board/list}"
               style="font-size:18px; font-weight:bold; color:#333; text-decoration:none;">
                🏠 Consulting 커뮤니티
            </a>
        </div>

        <div style="font-size:14px; color:#555; display:flex; align-items:center;">

            <!-- 로그인한 경우 -->
            <div th:if="${#authorization.expression('isAuthenticated()')}" style="display:flex; align-items:center;">
                <span style="margin-right:15px;">
                    <strong th:text="${loginMember.name}">user</strong>님 환영합니다!
                </span>

                <a th:href="@{/member/list}" style="margin:0;
                   padding:6px 12px; background-color:#007bff;
                    color:white; border:none; border-radius:4px;
                    font-size:13px; cursor:pointer; text-decoration:none;
                    display:inline-block; margin-right:8px;">
                        회원정보
                </a>

                <form th:action="@{/member/logout}" method="post" style="margin:0;">
                    <button type="submit"
                            style="padding:6px 12px; background-color:#dc3545; color:white; border:none; border-radius:4px; font-size:13px; cursor:pointer;">
                        로그아웃
                    </button>
                </form>
            </div>

            <!-- 로그인 안 한 경우 -->
            <div th:unless="${#authorization.expression('isAuthenticated()')}" style="display:flex; align-items:center;">
                <a th:href="@{/member/login}"
                   style="padding:6px 12px; background-color:#0d6efd; color:white; text-decoration:none; border-radius:4px; font-size:13px;">
                    로그인
                </a>

                <a th:href="@{/member/new}"
                   style="padding:6px 12px; background-color:#0d6efd; color:white; text-decoration:none; border-radius:4px; font-size:13px;">
                    회원가입
                </a>
            </div>

        </div>

    </div>
</div>
</html>
